# Solver-Judge Evaluation Configuration
# This config demonstrates the two-phase solver-judge workflow

defaults:
  - _self_

# Hydra configuration
hydra:
  run:
    dir: ./outputs/solver_judge_eval/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/solver_judge_eval/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Evaluation entry point
entry_point: examples.solver_judge.main::test_solver_judge

# Dataset configuration (optional - uses DEMO_ROWS by default)
# dataset:
#   path: path/to/your/dataset.jsonl
#   max_rows: 100

# Solver model configuration
solver:
  model: accounts/fireworks/models/llama-v3p1-8b-instruct
  n_solutions: 3
  temperatures:
    - 0.3
    - 0.5
    - 0.7

# Judge model configuration
judge:
  model: accounts/fireworks/models/llama-v3p1-70b-instruct
  temperature: 0.0
  max_tokens: 4096

# Evaluation parameters
evaluation:
  num_runs: 1
  aggregation_method: mean
  max_concurrent_rollouts: 8
  max_concurrent_evaluations: 16

# Output configuration
output:
  results_file: solver_judge_results.jsonl
  preview_file: solver_judge_preview.jsonl
